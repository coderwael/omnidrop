name: omnidrop_desktop
description: OmniDrop Desktop Client (Windows/Linux) - System Tray Daemon & Floating Drop Overlay
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  ffi: ^2.1.2
  desktop_drop: ^0.4.4
  system_tray: ^2.0.3
  window_manager: ^0.3.9
  file_picker: ^8.0.3
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
