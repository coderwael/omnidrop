[package]
name = "rust_omnidrop"
version = "1.0.0"
edition = "2021"
authors = ["OmniDrop Distributed Systems Engineering"]
description = "High-performance multi-channel P2P transport and zero-copy chunk engine for OmniDrop"

[lib]
name = "rust_omnidrop"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
tokio = { version = "1.37", features = ["full"] }
quinn = "0.10"
rustls = { version = "0.21", features = ["dangerous_configuration", "quic"] }
rcgen = "0.12"
flume = "0.11"
memmap2 = "0.9"
sha2 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
bytes = "1.6"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mdns-sd = "0.10"
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
once_cell = "1.19"
parking_lot = "0.12"
rayon = "1.10"
uuid = { version = "1.8", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
